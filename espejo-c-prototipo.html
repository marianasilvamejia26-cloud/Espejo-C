<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Espejo C — Prototipo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E9E5A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Espejo C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --grad-start:#FFDE59;
    --grad-end:#1E9E5A;
    --navy:#1E9E5A;
    --navy-pair:#FFDE59;
    --maroon:#B33771;
    --outline:#1B1B1F;
    --cream:#F5F2EA;
    --panel:#EFEBE1;
    --line:#E6E1D3;
    --ink:#1B1B1F;
    --ink-soft:#7A7770;
    --periwinkle:#7B6FEF;
    --blue-avatar:#8ED4F5;
    --pink-avatar:#F6B8CE;
    --yellow-avatar:#F5E75C;
    --white-avatar:#F3F1EA;
    --gray-avatar:#C9C6BC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    background:#127A45;
    padding:40px 16px 60px;
    color:var(--ink);
  }
  h1,h2,h3{font-family:'Bricolage Grotesque', sans-serif;}

  .stage-label{
    color:var(--navy);
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.02em;
    background:rgba(255,255,255,.55);
    padding:6px 16px;
    border-radius:999px;
  }

  .phone{
    width:340px;
    height:696px;
    background:var(--outline);
    border-radius:46px;
    padding:12px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.25);
    position:relative;
  }
  .phone::before{ /* notch */
    content:"";
    position:absolute;
    top:12px; left:50%; transform:translateX(-50%);
    width:120px; height:22px;
    background:var(--outline);
    border-bottom-left-radius:16px;
    border-bottom-right-radius:16px;
    z-index:5;
  }
  .screen{
    width:100%; height:100%;
    background:var(--cream);
    border-radius:36px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; font-weight:600; color:var(--navy);
    padding:14px 24px 4px;
    flex-shrink:0;
  }
  .content{
    flex:1;
    overflow-y:auto;
    padding:6px 22px 18px;
  }
  .content::-webkit-scrollbar{width:0;}
  .content.fade{ animation:fadeIn .28s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  [onclick]{ transition:transform .1s ease; }
  [onclick]:active{ transform:scale(.95); }

  /* ---------- shared bits ---------- */
  .back-row{ display:flex; align-items:center; gap:10px; padding:6px 0 14px; }
  .back-btn{
    width:32px; height:32px; border-radius:10px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; background:#fff; cursor:pointer;
  }
  .eyebrow{ font-size:12px; color:var(--ink-soft); margin-bottom:2px;}
  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:14px;
    background:linear-gradient(135deg, var(--navy), #FF8A3D); color:#fff; font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700; font-size:15px; cursor:pointer; text-align:center;
    box-shadow:0 5px 0 rgba(0,0,0,.12); transition:transform .1s;
  }
  .btn-primary:active{ transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .btn-secondary{
    width:100%; padding:12px; border:1.5px solid var(--navy); border-radius:14px;
    background:transparent; color:var(--navy); font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; text-align:center;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px;
    box-shadow:0 6px 18px rgba(179,55,113,.08);
  }
  .pill-btn{
    flex:1; border-radius:14px; overflow:hidden; position:relative;
    padding:14px 12px; font-size:12.5px; font-weight:700; color:#fff;
    display:flex; flex-direction:column; align-items:flex-start; gap:6px; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.12); transition:transform .1s;
  }
  .pill-btn:active{ transform:scale(.96); }
  .pill-btn.pat-a{ background:linear-gradient(135deg,#8B5CF6,#4EA8FF); }
  .pill-btn.pat-b{ background:linear-gradient(135deg,#FF4F81,#FF8A3D); }
  .pill-btn::before{
    content:''; position:absolute; top:-16px; right:-16px; width:56px; height:56px;
    border-radius:50%; background:rgba(255,255,255,.18);
  }
  .pill-btn::after{
    content:''; position:absolute; bottom:-20px; right:14px; width:34px; height:34px;
    border-radius:8px; background:rgba(255,255,255,.14); transform:rotate(20deg);
  }

  /* ---------- onboarding ---------- */
  .brand-title{ font-size:30px; color:var(--navy); font-weight:700; }
  .brand-sub{ color:var(--maroon); font-weight:600; font-size:13px; margin-top:6px; }
  .onboard-copy{ color:var(--ink-soft); font-size:13.5px; line-height:1.55; margin:20px 4px 28px; }

  /* ---------- home ---------- */
  .hello{ font-size:20px; font-weight:700; color:var(--navy); }
  .hello-sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; margin-bottom:16px;}
  .progress-card{ display:flex; gap:16px; align-items:center; }
  .ring{
    width:74px; height:74px; border-radius:50%; flex-shrink:0;
    background:conic-gradient(var(--navy) calc(var(--pct,65)*1%), var(--panel) 0);
    display:flex; align-items:center; justify-content:center;
  }
  .ring-inner{ width:56px; height:56px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-inner b{font-size:15px; color:var(--navy);}
  .ring-inner span{font-size:8.5px; color:var(--ink-soft);}
  .stat-row{ display:flex; justify-content:space-between; font-size:12px; margin-top:6px;}
  .stat-row b{color:var(--navy); font-size:14px;}
  .section-title{ font-size:13px; font-weight:700; color:var(--navy); margin:18px 0 8px; }
  .last-entry{ display:flex; align-items:center; gap:12px; }
  .icon-chip{ width:38px; height:38px; border-radius:10px; background:var(--panel); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .quick-row{ display:flex; gap:10px; margin-top:10px;}

  /* ---------- cat-item (áreas explora) ---------- */
  .cat-item{ display:flex; gap:12px; align-items:center; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .cat-icon{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .cat-title{ font-weight:700; color:var(--navy); font-size:14px;}
  .cat-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px;}

  /* ---------- tiles tipo "pick what you love" ---------- */
  .tile-grid{ display:flex; flex-wrap:wrap; gap:12px; }
  .tile{ flex:0 0 calc(50% - 6px); box-sizing:border-box; border-radius:20px; padding:14px; color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.1); transition:transform .12s; }
  .tile:active{ transform:scale(.96); }
  .tile-icon{ width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center; margin-bottom:22px; }
  .tile-title{ font-family:'Bricolage Grotesque'; font-weight:700; font-size:14.5px; }
  .tile-sub{ font-size:11px; opacity:.85; margin-top:2px; }

  /* ---------- pregunta ---------- */
  .progress-bar-track{ height:6px; background:var(--panel); border-radius:99px; margin:10px 0 18px; overflow:hidden;}
  .progress-bar-fill{ height:100%; background:var(--navy); border-radius:99px; }
  .q-text{ font-size:18px; font-weight:700; color:var(--navy); line-height:1.4; margin-bottom:16px; }
  textarea{
    width:100%; min-height:110px; border:1px solid var(--line); border-radius:14px;
    padding:12px; font-family:'Inter'; font-size:13px; resize:none; background:#fff; color:var(--ink);
  }
  textarea::placeholder{ color:#B7B2A6; }
  .q-actions{ display:flex; gap:10px; margin-top:16px; }

  /* ---------- registrar experiencia ---------- */
  label{ display:block; font-size:12px; font-weight:600; color:var(--navy); margin:14px 0 6px;}
  input[type=text], input[type=date]{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; font-size:13px; font-family:'Inter'; color:var(--ink);
  }
  .emoji-row{ display:flex; gap:8px; }
  .emoji-btn{ flex:1; padding:10px 0; border-radius:12px; border:1px solid var(--line); background:#fff; text-align:center; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .emoji-btn.active{ border-color:var(--navy); background:var(--panel); }

  /* ---------- evolución ---------- */
  .tabs{ display:flex; gap:6px; background:var(--panel); border-radius:12px; padding:4px; margin-bottom:14px;}
  .tab{ flex:1; text-align:center; padding:8px 0; border-radius:10px; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .tab.active{ background:#fff; color:var(--navy); }
  .timeline-item{ display:flex; gap:12px; padding:12px 0; }
  .dot{ width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px;}
  .tl-date{ font-size:10.5px; color:var(--ink-soft); font-weight:600; }
  .tl-title{ font-size:13.5px; font-weight:700; color:var(--navy); margin-top:1px;}

  /* ---------- identidad ---------- */
  .avatar{ width:76px; height:76px; border-radius:50%; background:var(--panel); border:2px solid var(--line); margin:6px auto 14px; display:flex; align-items:center; justify-content:center; font-size:30px;}
  .id-card{ margin-bottom:12px; display:flex; justify-content:space-between; align-items:flex-start; border-left:5px solid var(--accent, var(--navy)); }
  .id-card h4{ font-size:13px; color:var(--navy); margin-bottom:4px;}
  .id-card p{ font-size:12.5px; color:var(--ink-soft); }
  .link-edit{ font-size:11.5px; color:var(--maroon); font-weight:700; white-space:nowrap; margin-left:8px; }

  /* ---------- insights ---------- */
  .bars{ display:flex; align-items:flex-end; gap:8px; height:70px; margin:14px 0 4px; }
  .bars > div{ flex:1; border-radius:6px 6px 0 0; }
  .bar-legend{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--ink-soft); margin-bottom:14px;}
  .metric-row{ margin-top:10px; }
  .metric-label{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;}
  .metric-track{ height:7px; background:var(--panel); border-radius:99px; overflow:hidden;}
  .metric-fill{ height:100%; background:var(--maroon); border-radius:99px;}
  .quote-card{ background:var(--navy); color:#fff; border-radius:16px; padding:16px; margin-top:18px; font-size:12.5px; line-height:1.5; }
  .quote-card b{ font-family:'Bricolage Grotesque'; }

  /* ---------- bottom nav ---------- */
  .navbar{
    display:flex; align-items:center; justify-content:space-around;
    padding:10px 10px 16px; border-top:1px solid var(--line); background:#fff; flex-shrink:0;
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; opacity:.45; padding:5px 12px; border-radius:14px; }
  .nav-item.active{ opacity:1; background:var(--panel); }
  .nav-item span{ font-size:9px; font-weight:600; color:var(--navy); }
  .nav-plus{
    width:40px; height:40px; border-radius:50%; background:var(--navy); display:flex; align-items:center; justify-content:center;
    margin-top:-24px; box-shadow:0 6px 14px rgba(179,55,113,.35); opacity:1 !important; cursor:pointer;
  }

  .controls{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:340px;
  }
  .controls button{
    font-family:'Bricolage Grotesque'; font-weight:600; font-size:12.5px; color:var(--navy);
    background:#fff; border:1px solid rgba(179,55,113,.25); padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .controls button.current{ background:var(--navy); color:#fff; }

  /* ---------- estilo "app real": badges, ruta, pregunta del día ---------- */
  .badge-row{ display:flex; gap:10px; margin-bottom:16px; }
  .badge{ display:flex; align-items:center; gap:6px; border:2.5px solid var(--outline); border-radius:999px; padding:7px 14px; font-family:'Bricolage Grotesque'; font-weight:600; font-size:14px; background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.1); }
  .badge.flame{ background:linear-gradient(135deg,#FFE1B0,#FFB25C); }
  .badge.star{ background:linear-gradient(135deg,#FFF3C4,#FFD65C); }
  .avatar-wrap-outer{ position:relative; width:118px; height:118px; margin:6px auto 12px; }
  .sparkle{ position:absolute; font-size:16px; animation:twinkle 1.8s ease-in-out infinite; }
  .sparkle.s1{ top:-4px; left:2px; animation-delay:0s; }
  .sparkle.s2{ top:6px; right:-8px; animation-delay:.5s; font-size:12px; }
  .sparkle.s3{ bottom:2px; left:-10px; animation-delay:1s; font-size:13px; }
  @keyframes twinkle{ 0%,100%{opacity:.3; transform:scale(.8);} 50%{opacity:1; transform:scale(1.15);} }
  .avatar-big-wrap{ width:110px; height:110px; border-radius:50%; border:3px solid var(--outline); background:linear-gradient(160deg,#FFE9C7,#FFD1DC); display:flex; align-items:center; justify-content:center; margin:0 auto; animation:floaty 3s ease-in-out infinite; box-shadow:0 6px 0 rgba(0,0,0,.1); }
  @keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
  .greeting-title{ font-family:'Bricolage Grotesque'; font-weight:600; font-size:21px; color:var(--ink); text-align:center; }
  .greeting-date{ text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:2px; margin-bottom:14px; }
  .brand-big{ font-family:'Bricolage Grotesque'; font-weight:700; font-size:26px; text-align:center; color:var(--navy); margin-top:18px; }
  .brand-tag{ text-align:center; color:var(--ink-soft); font-size:12.5px; margin:6px 6px 18px; line-height:1.5; }
  .pregunta-dia-card{ border:2.5px solid var(--outline); border-radius:20px; background:linear-gradient(135deg,var(--grad-start),var(--grad-end)); padding:16px; margin-bottom:24px; box-shadow:0 6px 0 rgba(0,0,0,.08); }
  .pregunta-dia-label{ font-family:'Bricolage Grotesque'; font-weight:600; font-size:11px; letter-spacing:.04em; color:#fff; opacity:.85; margin-bottom:6px; }
  .pregunta-dia-text{ font-family:'Bricolage Grotesque'; font-weight:600; font-size:16px; color:#fff; line-height:1.35; margin-bottom:10px; }
  .pregunta-dia-link{ font-family:'Bricolage Grotesque'; font-weight:700; color:#fff; font-size:14px; cursor:pointer; }
  .ruta-title{ font-family:'Bricolage Grotesque'; font-weight:600; font-size:15px; color:var(--ink); margin:2px 0 18px; text-align:center; }
  .ruta-path{ display:flex; flex-direction:column; align-items:center; }
  .ruta-node-wrap{ display:flex; flex-direction:column; align-items:center; }
  .ruta-node{ width:64px; height:64px; border-radius:18px; border:3px solid var(--outline); display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.15); transition:transform .12s; }
  .ruta-node:active{ transform:scale(.9) translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .ruta-label{ margin-top:8px; border:2px solid var(--outline); border-radius:999px; padding:4px 13px; font-family:'Bricolage Grotesque'; font-weight:600; font-size:12px; background:#fff; }
  .ruta-connector{ width:4px; height:30px; background:repeating-linear-gradient(to bottom, var(--outline) 0 6px, transparent 6px 12px); margin:2px 0; }
  .ruta-node-wrap{ position:relative; }
  .new-tag{ position:absolute; top:-8px; right:-10px; background:#FF4F81; color:#fff; font-family:'Bricolage Grotesque'; font-weight:700; font-size:9px; padding:2px 6px; border-radius:999px; border:1.5px solid var(--outline); }

  /* ---------- globo de conclusión junto al avatar ---------- */
  .avatar-bubble{
    background:#fff; border:2px solid var(--outline); border-radius:16px; padding:8px 12px;
    font-family:'Bricolage Grotesque'; font-weight:600; font-size:11.5px; color:var(--ink); text-align:center;
    max-width:170px; margin:8px auto 4px; position:relative; box-shadow:0 3px 0 rgba(0,0,0,.08);
  }
  .avatar-bubble::after{
    content:''; position:absolute; top:-7px; left:50%; transform:translateX(-50%);
    border-width:0 7px 7px 7px; border-style:solid; border-color:transparent transparent var(--outline) transparent;
  }

  /* ---------- confeti ---------- */
  .confetti-piece{
    position:fixed; width:8px; height:8px; border-radius:2px; pointer-events:none; z-index:999;
    animation:confettiFly .9s ease-out forwards;
  }
  @keyframes confettiFly{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }

  /* ---------- onboarding tipo Duolingo (fondo de color completo) ---------- */
  .content.full-bleed{ padding:0; }
  .onboard-full{
    min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:34px 26px 26px; background:linear-gradient(160deg, var(--navy), var(--navy-pair)); color:#fff; text-align:center; box-sizing:border-box;
  }
  .onboard-top{ display:flex; flex-direction:column; align-items:center; }
  .onboard-brand{ font-family:'Bricolage Grotesque'; font-weight:700; font-size:24px; letter-spacing:.01em; }
  .onboard-illustration-wrap{ margin:18px 0 10px; }
  .onboard-step-title{ font-family:'Bricolage Grotesque'; font-weight:600; font-size:19px; margin-top:6px; }
  .onboard-step-sub{ font-size:12.5px; opacity:.9; margin:6px 10px 4px; line-height:1.5; }
  .onboard-swatch-row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:14px 0; }
  .onboard-swatch{ width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .btn-onboard-white{
    width:100%; padding:14px; border:none; border-radius:14px; background:#fff; color:var(--navy);
    font-family:'Bricolage Grotesque'; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.15); transition:transform .1s;
  }
  .btn-onboard-white:active{ transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.15); }
  .btn-onboard-ghost{ background:transparent; border:none; color:#fff; opacity:.85; font-family:'Bricolage Grotesque'; font-weight:600; font-size:13px; cursor:pointer; margin-top:10px; }
  .type-toggle-onboard{ display:flex; gap:8px; background:rgba(255,255,255,.18); border-radius:14px; padding:4px; margin:14px 0; width:100%; }
  .type-toggle-onboard div{ flex:1; text-align:center; padding:9px 0; border-radius:11px; font-family:'Bricolage Grotesque'; font-weight:600; font-size:13px; cursor:pointer; color:#fff; }
  .type-toggle-onboard div.active{ background:#fff; color:var(--navy); }
  .gallery-grid{ display:flex; flex-wrap:wrap; gap:10px; width:100%; }
  .gallery-item{ flex:0 0 30%; box-sizing:border-box; background:rgba(255,255,255,.14); border:2px solid transparent; border-radius:16px; padding:6px 2px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; }
  .gallery-item.selected{ background:#fff; border-color:#fff; }

  /* ---------- personalizar avatar (fondo claro, estilo referencia) ---------- */
  .avatar-setup-light{
    min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:30px 22px 26px; background:var(--cream); box-sizing:border-box;
  }
  .type-toggle-light{ display:inline-flex; gap:6px; background:var(--panel); border-radius:14px; padding:4px; margin-bottom:20px; }
  .type-toggle-light div{ padding:8px 20px; border-radius:11px; font-family:'Bricolage Grotesque'; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .type-toggle-light div.active{ background:var(--outline); color:#fff; }
  .setup-title{ font-family:'Bricolage Grotesque'; font-weight:800; font-size:27px; color:var(--outline); line-height:1.15; margin-bottom:6px; }
  .big-avatar-preview{ margin:10px 0 24px; filter:drop-shadow(0 10px 14px rgba(0,0,0,.12)); }
  .preset-row{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .preset-item{ display:flex; flex-direction:column; align-items:center; cursor:pointer; gap:6px; }
  .preset-circle{ width:52px; height:52px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; border:2.5px solid transparent; background:var(--panel); transition:transform .1s; }
  .preset-circle.selected{ border-color:var(--outline); }
  .preset-item:active .preset-circle{ transform:scale(.92); }

function copyAreaAnswer(i, btn){
  const text = (areaAnswers[i] || '').trim();
  const orig = btn.textContent;
  if(!text){ btn.textContent = 'Escribe algo primero'; setTimeout(()=>{ btn.textContent = orig; }, 1500); return; }
  const flash = ()=>{ btn.textContent = '¡Copiado! ✓'; setTimeout(()=>{ btn.textContent = orig; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flash).catch(flash);
  } else { flash(); }
}

function confetti(){
  const colors = ['#FF4F81','#FF8A3D','#2EC4B6','#8B5CF6','#4EA8FF','#FFC93C'];
  const rect = document.querySelector('.phone').getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  for(let i=0; i<16; i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*90;
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    p.style.setProperty('--rot', (Math.random()*360)+'deg');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 950);
  }
}

    <button class="btn-secondary" style="width:auto; padding:8px 14px; font-size:12px;" onclick="activarRecordatorios()">${remindersOn ? 'Activados ✓' : 'Activar'}</button>
  </div>`;
}

    <div style="font-size:12.5px; font-weight:700; color:var(--navy);">Crecimiento personal</div>

    <div class="bars">
      ${vals.map(v=>`<div style="height:${v}%; background:var(--navy);"></div>`).join('')}

  <div class="quote-card"><b>"No se trata de tenerlo todo claro, sino de seguir construyéndote."</b><br>Sigue reflejando tu mejor versión ✨</div>`;

function screenPersonalizar(){
  return `
  <div class="back-row"><div class="back-btn" onclick="go('perfil')">${icons.back}</div></div>
  <div class="section-title" style="margin-top:0; text-align:center;">Personalizar</div>
  <div style="display:flex; justify-content:center; margin:4px 0 16px;">${renderCharacter(avatarState, 96, true)}</div>
  <div class="tabs">
    <div class="tab ${personalizarTab==='tema'?'active':''}" onclick="personalizarTab='tema'; render('personalizar')">Tema</div>
    <div class="tab ${personalizarTab==='avatar'?'active':''}" onclick="personalizarTab='avatar'; render('personalizar')">Avatar</div>
  </div>
  ${personalizarTab==='tema' ? temaTabHTML() : avatarTabHTML()}`;
}

function temaTabHTML(){
  return `
  <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;">Elige el color principal de tu app.</p>
  <div style="display:flex; flex-wrap:wrap; gap:14px;">
  ${themeColors.map(c=>`
    <div style="text-align:center;">
      <div onclick="setTheme('${c.hex}')" style="width:44px; height:44px; border-radius:50%; background:${c.hex}; display:flex; align-items:center; justify-content:center; cursor:pointer; border:3px solid ${theme===c.hex?'var(--ink)':'transparent'};">
        ${theme===c.hex ? '<span style="color:#fff; font-size:16px;">✓</span>' : ''}
      </div>
      <div style="font-size:10px; color:var(--ink-soft); margin-top:4px;">${c.name}</div>
    </div>`).join('')}
  </div>`;
}

function avatarTabHTML(){
  const humanPart = `
  <label style="margin-top:2px;">Tono de piel</label>
  <div style="display:flex; gap:10px; margin-bottom:4px;">
  ${skinTones.map(c=>`<div onclick="setAvatar('skin','${c}')" style="width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${avatarState.skin===c?'var(--navy)':'var(--outline)'};"></div>`).join('')}
  </div>
  <label>Color de cabello</label>
  <div style="display:flex; gap:10px; margin-bottom:4px;">
  ${hairColors.map(c=>`<div onclick="setAvatar('hair','${c}')" style="width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${avatarState.hair===c?'var(--navy)':'#00000022'};"></div>`).join('')}
  </div>
  <label>Estilo de cabello</label>
  <div style="display:flex; gap:8px; margin-bottom:4px;">
  ${hairStyles.map(s=>`<div onclick="setAvatar('style','${s}')" style="flex:1;text-align:center;padding:10px 0;border-radius:12px;border:1.5px solid ${avatarState.style===s?'var(--navy)':'var(--line)'};font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;">${s.charAt(0).toUpperCase()+s.slice(1)}</div>`).join('')}
  </div>
  <label>Lentes</label>
  <div onclick="setAvatar('lentes', ${!avatarState.lentes})" style="display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border:1px solid var(--line); border-radius:12px; cursor:pointer;">
    <span style="font-size:13px; font-weight:600; color:var(--navy);">Usar lentes</span>
    <span style="font-size:12px; color:var(--ink-soft);">${avatarState.lentes ? 'Sí ✓' : 'No'}</span>
  </div>`;

  const animalPart = `
  <label style="margin-top:2px;">Elige tu animalito</label>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:4px;">
  ${Object.keys(animalInfo).map(k=>`
    <div onclick="setAvatar('animalKind','${k}')" style="text-align:center; padding:8px 4px; border-radius:14px; border:2px solid ${avatarState.animalKind===k?'var(--navy)':'var(--line)'}; background:${avatarState.animalKind===k?'var(--panel)':'#fff'}; cursor:pointer;">
      ${renderAnimalHead(k, 48)}
      <div style="font-size:11px; font-weight:700; color:var(--navy); margin-top:2px;">${animalInfo[k].name}</div>
    </div>`).join('')}
  </div>`;

  const mascotaPart = `
  <label style="margin-top:2px;">Color de tu mascota</label>
  <div style="display:flex; gap:10px; margin-bottom:14px;">
  ${blobColors.map(c=>`<div onclick="setAvatar('mascotColor','${c}')" style="width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${avatarState.mascotColor===c?'var(--navy)':'var(--outline)'};"></div>`).join('')}
  </div>
  <label style="margin-top:0;">Elige tu personaje</label>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:4px;">
  ${Object.keys(blobInfo).map(k=>`
    <div onclick="setAvatar('mascotKind','${k}')" style="text-align:center; padding:8px 4px; border-radius:14px; border:2px solid ${avatarState.mascotKind===k?'var(--navy)':'var(--line)'}; background:${avatarState.mascotKind===k?'var(--panel)':'#fff'}; cursor:pointer;">
      ${renderBlob(k, avatarState.mascotColor, 42)}
      <div style="font-size:11px; font-weight:700; color:var(--navy); margin-top:2px;">${blobInfo[k]}</div>
    </div>`).join('')}
  </div>`;

  return `
  <label style="margin-top:2px;">Tipo de avatar</label>
  <div style="display:flex; gap:8px; margin-bottom:14px;">
    <div onclick="setAvatar('type','humano')" style="flex:1; text-align:center; padding:9px 0; border-radius:12px; border:1.5px solid ${avatarState.type==='humano'?'var(--navy)':'var(--line)'}; background:${avatarState.type==='humano'?'var(--panel)':'#fff'}; font-size:12px; font-weight:700; color:var(--navy); cursor:pointer;">Humano</div>
    <div onclick="setAvatar('type','animal')" style="flex:1; text-align:center; padding:9px 0; border-radius:12px; border:1.5px solid ${avatarState.type==='animal'?'var(--navy)':'var(--line)'}; background:${avatarState.type==='animal'?'var(--panel)':'#fff'}; font-size:12px; font-weight:700; color:var(--navy); cursor:pointer;">Animal</div>
    <div onclick="setAvatar('type','mascota')" style="flex:1; text-align:center; padding:9px 0; border-radius:12px; border:1.5px solid ${avatarState.type==='mascota'?'var(--navy)':'var(--line)'}; background:${avatarState.type==='mascota'?'var(--panel)':'#fff'}; font-size:12px; font-weight:700; color:var(--navy); cursor:pointer;">Mascota</div>
  </div>
  ${avatarState.type === 'humano' ? humanPart : avatarState.type === 'animal' ? animalPart : mascotaPart}
  <div style="margin-top:18px;"><button class="btn-primary" onclick="go('perfil')">Guardar cambios</button></div>`;
}

// ---------------- render ----------------
function render(screen){
  const map = {
    hero: screenHero, onboarding: screenOnboarding, avatarSetup: screenAvatarSetup, home: screenHome, explorar: screenExplorar,
    pregunta: screenPregunta, registrar: screenRegistrar, progreso: screenProgreso,
    perfil: screenPerfil, insights: screenInsights, personalizar: screenPersonalizar, areas: screenAreas
  };
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = map[screen]();
  contentEl.scrollTop = 0;
  contentEl.classList.toggle('full-bleed', screen === 'hero' || screen === 'onboarding' || screen === 'avatarSetup');
  contentEl.classList.remove('fade');
  void contentEl.offsetWidth;
  contentEl.classList.add('fade');
  document.getElementById('navbar').innerHTML = (screen==='hero' || screen==='onboarding' || screen==='avatarSetup') ? '' : `
    <div class="nav-item" data-nav="home" onclick="go('home')">${icons.home}<span>Inicio</span></div>
    <div class="nav-item" data-nav="explorar" onclick="go('explorar')">${icons.search}<span>Explorar</span></div>
    <div class="nav-plus" onclick="go('registrar')">${icons.plus}</div>
    <div class="nav-item" data-nav="progreso" onclick="go('progreso')">${icons.chart}<span>Progreso</span></div>
    <div class="nav-item" data-nav="perfil" onclick="go('perfil')">${icons.user}<span>Perfil</span></div>`;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.nav===screen));
}

let remindersOn = false;

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* requiere estar hospedado con https */ });
  });
}
go('hero');

// Nota: el registro de service worker (instalación como PWA) no aplica
// dentro de esta vista de artifact; el botón de notificaciones de abajo
// sigue funcionando como demo local con la API estándar de Notification.

function activarRecordatorios(){
  if(!('Notification' in window)){
    alert('Este navegador no soporta notificaciones. Pruébalo en Chrome/Safari sobre HTTPS.');
    return;
  }
  Notification.requestPermission().then(permiso=>{
    if(permiso === 'granted'){
      new Notification('¡Hora de tu registro! 🪞', {
        body: '¿Qué aprendiste esta semana? Tómate 2 minutos para reflejarlo en Espejo C.',
        icon: 'icon-192.png'
      });
      remindersOn = true;
    } else {
      remindersOn = false;
    }
    render(currentScreen);
  });
}
</script>
